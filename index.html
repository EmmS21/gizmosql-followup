    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #2b2620;
      color: var(--ink);
      font: 14px/1.35 "Trebuchet MS", "Segoe UI", sans-serif;
    }
    button, select { font: inherit; color: inherit; cursor: pointer; }
    #game { height: 100%; position: relative; }
    .main {
      position: absolute;
      inset: 0;
      display: flex;
      min-height: 0;
    }

    .office {
      --scale: 1;
      flex: 1.4;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin: 0;
      background:
        radial-gradient(ellipse 70% 36% at 50% 8%, rgba(255, 226, 176, 0.22) 0%, transparent 72%),
        radial-gradient(ellipse 28% 22% at 16% 70%, rgba(62, 34, 12, 0.10) 0%, transparent 70%),
        radial-gradient(ellipse 24% 18% at 82% 86%, rgba(48, 26, 10, 0.11) 0%, transparent 68%),
        linear-gradient(#b89264, var(--carpet) 40%, #9a734c);
      border: 8px solid #5a3d28;
      overflow: hidden;
    }
    .office.shut { filter: grayscale(0.4) brightness(0.88); }
    .office.slow .person { filter: saturate(0.75); }
    #office.offices {
      display: flex;
      flex-direction: row;
      flex: 1.4;
      min-width: 0;
      min-height: 0;
      margin: 0;
      gap: 4px;
    }
    .office.split {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      min-height: 0;
      margin: 0;
      border-width: 5px;
    }
    .office.split .runway {
      height: 20px;
      gap: 3px;
      padding: 0 4px;
      overflow: hidden;
    }
    .office.split .procs { min-width: 0; flex: 1; }
    .office.split .ptab .tick { display: none; }
    .office.split .ptab b {
      font-size: 5px;
      letter-spacing: 0;
      padding: 2px 3px;
    }
    .office.split .agent,
    .office.split .gbox { gap: 0; flex-shrink: 0; }
    .office.split .agent b,
    .office.split .gbox b {
      font-size: 6px;
      padding: 2px 5px;
    }
    .office.split .floor { inset: 222px 0 0; }
    .office.split .wharf { font-size: 7px; padding: 3px 5px; }
    .office.split .wharf b { font-size: 7px; }
    .office.split .bay { min-height: 36px; padding: 2px 3px; }
    .office.split .bay .lbl { font-size: 6px; }
    .office.split .cmp { font-size: 7px; }
    .office.split .vs-bar { font-size: 11px; padding: 4px 6px; }
    .office.split .wh-budget .amt { font-size: 11px; }
    .office.split .wh-budget .meter { width: 20px; height: 32px; }
    .office.split .budget-banner { font-size: 8px; padding: 3px 5px; }
    .office.split .slack { font-size: 11px; padding: 6px 8px; }
    .office.split .slack b.stop { font-size: 13px; }
    .office.split .cloud { width: 22px; height: 22px; }
    .office.split .cloud .emo { font-size: 12px; }
    .office.split .askline { font-size: 12px; max-width: 130px; }
    .office.split .cdot { font-size: 5px; padding: 0 2px; }
    .office.split .crow { grid-template-columns: 44px 1fr 1fr 1fr 1fr; gap: 2px; }
    .office.split .crow > b { font-size: 6px; padding-top: 3px; }
    .office.split .cstep { padding: 2px 3px; }
    .office.split .cstep em { font-size: 6px; }
    .office.split .cstep i { font-size: 7px; }

    .hvac {
      position: relative;
      flex-shrink: 0;
      height: auto;
      background:
        repeating-linear-gradient(90deg, transparent 0 48px, rgba(0, 0, 0, 0.14) 48px 49px),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0 2px, transparent 2px 8px),
        linear-gradient(#4a5660, #2a333a 55%, #1e262c);
      border-bottom: 5px solid #14181c;
      color: #e8e2d6;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      box-shadow: inset 0 18px 40px #9ec4d418;
    }
    .engines {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      flex-shrink: 0;
      min-height: 0;
    }
    .engines > button {
      border: 2px solid #1a2024;
      background: #c8cdd0;
      color: #1a2024;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 4px;
    }
    .engines button.on { background: var(--amber); }
    .vs-bar {
      flex-shrink: 0;
      padding: 7px 10px;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.02em;
      background: #2a2420;
      color: #f3ead8;
      border-bottom: 3px solid #111;
    }
    .vs-bar.giz { background: #2f6f8a; }
    .vs-bar em { font-style: normal; font-weight: 700; font-size: 11px; opacity: 0.8; margin-left: 8px; }
    .engines.gizonly { min-height: 0; color: #e4eef2; font-weight: 800; font-size: 12px; }
    .vs-ledgers {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 6px;
      margin-bottom: 8px;
      min-width: 0;
      width: 100%;
    }
    .vs-ledgers .soldbig {
      width: 100%;
      max-width: 100%;
      min-width: 0;
      margin-bottom: 0;
      overflow: hidden;
      text-align: left;
      white-space: normal;
    }
    .vs-ledgers .soldbig .k {
      overflow-wrap: anywhere;
    }
    .vs-ledgers .soldbig .ba {
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .vs-ledgers .soldbig .n,
    .vs-ledgers .soldbig .ba .n {
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      overflow-wrap: normal;
      word-break: normal;
    }
    .vs-ledgers .soldbig .sub {
      font-size: 8px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .soldbig.giz { border-color: #2f6f8a; }
    .soldbig.giz .n { color: #2d6a32; }
    .stage {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0 8px 2px;
      flex: 0 0 auto;
      min-height: 0;
    }
    .wharf {
      width: min(520px, 96%);
      background: linear-gradient(#3a4248, #2a3238 40%, #232a30);
      border: 2px solid #1a2024;
      padding: 5px 7px;
      font-size: 8px;
      position: relative;
      box-shadow: inset 0 1px 0 #6a7278, 0 2px 0 #111;
    }
    .wharf b {
      display: block;
      font-size: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.55;
      margin-bottom: 2px;
    }
    .wharf.hit { border-color: var(--amber); box-shadow: 0 0 0 2px #e09a3255; }
    .wharf.work { border-color: #6af; box-shadow: 0 0 0 2px #66aaff55; }
    .wharf.dim { opacity: 0.4; }
    .wharf.duck { border-color: #2f6f8a; }
    .wharf.duck .wharf-head > b { opacity: 1; color: #8ec8e0; }
    .wharf .whoowns {
      font-size: 10px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .wharf-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 4px;
    }
    .wh-budget {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      border: 0;
      background: none;
      color: inherit;
      padding: 0;
      font: inherit;
    }
    .wh-budget .tankwrap { display: block; }
    .wh-budget .tank {
      width: 168px;
      height: 16px;
      background: #1a2228;
      border: 1px solid #8aa;
    }
    .wh-budget .tank i { background: #6a8; }
    .wh-budget.warn .tank i { background: #e09a32; animation: tankpulse 0.9s ease infinite; }
    .wh-budget.dead .tank i { background: var(--coral); animation: tankpulse 0.45s ease infinite; }
    .wh-id { display: flex; align-items: center; gap: 8px; }
    .wh-power {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.7;
    }
    .wh-power i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3a4548;
      border: 1px solid #111;
    }
    .wh-power.on { color: #e09a32; opacity: 1; }
    .wh-power.on i { background: #e09a32; box-shadow: 0 0 8px #e09a32; animation: tankpulse 0.7s ease infinite; }
    .wh-power.idle i { background: #2a3238; }
    .wh-budget .meter {
      width: 28px;
      height: 44px;
      background: #12181c;
      border: 2px solid #c4d0d4;
      border-radius: 2px 2px 4px 4px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px #0a1014, 0 0 0 1px #111;
    }
    .wh-budget .meter:after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      bottom: 3px;
      width: 5px;
      background: #fff2;
      z-index: 2;
      pointer-events: none;
    }
    .wh-budget .meter i {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(#8cb, #6a8);
      transition: height 0.55s ease;
    }
    .wh-budget .meter i.draining { box-shadow: 0 -4px 8px #c44b32aa; }
    .wh-budget.warn .meter i { background: #e09a32; animation: tankpulse 0.9s ease infinite; }
    .wh-budget.dead .meter i { background: var(--coral); animation: tankpulse 0.45s ease infinite; }
    .wh-budget .meter .m75, .wh-budget .meter .m90 {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: #e8e2d688;
      z-index: 1;
    }
    .wh-budget .meter .m75 { bottom: 75%; }
    .wh-budget .meter .m90 { bottom: 90%; }
    .wh-budget.draining .amt { color: #f3b2a4; }
    @keyframes tankpulse { 50% { opacity: 0.45; } }
    .wh-budget .tics {
      position: relative;
      display: block;
      width: 168px;
      height: 12px;
      font-size: 8px;
      font-weight: 800;
    }
    .wh-budget .tics u {
      position: absolute;
      top: 0;
      transform: translateX(-50%);
      font-style: normal;
      text-decoration: none;
      opacity: 0.7;
    }
    .wh-budget .amt { font-size: 14px; font-weight: 800; white-space: nowrap; }
    .wh-budget .amt em { font-style: normal; opacity: 0.55; font-size: 10px; }
    .wh-budget.dead .amt { color: #f3b2a4; }
    .wh-budget.warn .amt { color: #e09a32; }

(function () {

  const SIZES = [
    { id: 0.125, label: "X-Small" },

    { id: 1, label: "Large" },
    { id: 2, label: "2XL" },

  const ENGINE_IDS = ["snowflake", "bigquery", "databricks", "redshift", "postgres"];
  const ENGINE = {
    snowflake: {
      name: "Snowflake",
      cache: true,
      scan: 0,
      suspendMin: 5,
      minSec: 60,
      hourly: 24,
      why: "X-Small = 1 credit/hour. Enterprise us-east-1 list = $3/credit, so $3/hour. Large = 8 credits/hour, $24/hour. Size scales the statement price from Large. Same ask can hit the result cache: $0 compute.",
    },
    bigquery: {
      name: "BigQuery",
      cache: true,
      scan: (8 / 1024) * 6.25,
      suspendMin: 0,
      minSec: 0,
      hourly: 0,
      why: "On-demand $6.25/TiB scanned. Each new statement is a new job (we assume 8 GiB). Identical SQL can use cached results: $0. No warehouse-hour clock.",
    },
    databricks: {
      name: "Databricks",
      cache: true,
      scan: 0,
      suspendMin: 5,
      minSec: 120,
      hourly: 18,
      why: "SQL warehouse ~4 DBU/hour × $0.55/DBU (labeled). 2-minute minimum when it starts. Same SQL can use a result cache.",
    },
    redshift: {
      name: "Redshift",
      cache: true,
      scan: 0,
      suspendMin: 5,
      minSec: 60,
      hourly: 12,
      why: "ra3.xlplus on-demand ≈ $1.09/hour. Pause/resume like a warehouse: a cold start bills a minute. Result cache for the same SQL.",

      name: "Postgres",
      cache: false,
      scan: 0,
      suspendMin: 5,

  const Q = {

      if (!w || !w.built || who >= w.open) return;
      const p = PEOPLE[who];
      const b = book();
      const foc = w.focus[who] ?? 0;
      if (p.sql === "gmv|week") {
        const picked = foc >= 0;
        const shown = picked ? b.days[foc].k : b.week;
        const num = el.querySelector("[data-gmv-num]");
        const line = el.querySelector("[data-gmv-line]");

        if (num) {

      if (p.name === "Ben") {
        b.share.forEach((r, n) => {

          if (k) k.textContent = "$" + Math.round(r.k) + "k";

          if (bar) bar.style.width = (a.k / top) * 100 + "%";
          if (lab) lab.textContent = a.name + " $" + a.k.toFixed(1) + "k";

      if (p.name === "Gita") {

          const html = "<i class='go'></i>".repeat(b.shipped) + "<i></i>".repeat(n);
          if (box.getAttribute("data-html") !== html) {

  function startCharts() {
    if (state.chartRaf) return;

  function paintPeople(now) {
    if (!state.lastBody) state.lastBody = now || performance.now();
    const t = now || performance.now();
    const dt = Math.min(0.05, (t - state.lastBody) / 1000);
    state.lastBody = t;
    const sec = t / 1000;
    document.querySelectorAll("[data-person]").forEach((el) => {
      const i = +el.getAttribute("data-person");
      const site = el.closest("[data-world]") || document.getElementById("office");
      const w = state.worlds.find((x) => x.id === (site.getAttribute("data-world") || "a"));
      if (!w) return;
      if (!w.bodies) w.bodies = PEOPLE.map((_, n) => makeBody(n));
      const b = w.bodies[i];
      const asking = w.lastWho === i;
      const sit = seatOff(w, i) || asking;
      const office = el.closest(".office") || document.getElementById("office");
      const home = homeOf(i, office);
      const running = state.auto;
      const canWalk = running && !sit && i < w.open;
      if (sit) {
        b.x = home.x;
        b.y = home.y;
        b.tx = home.x;
        b.ty = home.y;
        b.mode = "sit";
      } else if (!running) {
        b.tx = b.x;
        b.ty = b.y;
        b.mode = "idle";
      } else if (canWalk) {
        b.wait -= dt;
        if (b.wait <= 0 && b.mode !== "walk") {
          const go = Math.random() < 0.35 ? home : {
            x: Math.max(3, Math.min(92, home.x + (Math.random() - 0.35) * (onPhone() ? 10 : 18))),
            y: Math.max(10, Math.min(92, home.y + (Math.random() - 0.45) * (onPhone() ? 8 : 16))),
          };
          b.tx = go.x;
          b.ty = go.y;
          b.wait = 2 + Math.random() * 3.5;
        }
      }
      const dx = b.tx - b.x;
      const dy = b.ty - b.y;
      const dist = Math.hypot(dx, dy);
      if (sit) {
        b.mode = "sit";
      } else if (!running) {
        b.mode = "idle";
      } else if (dist > 0.45) {
        b.mode = "walk";
        const step = 13 * dt * pace(w);
        const m = Math.min(step, dist);
        b.x += (dx / dist) * m;
        b.y += (dy / dist) * m;
        b.face = dx >= 0 ? 1 : -1;
        b.gait += dt * 9.5;
      } else {
        b.x = b.tx;
        b.y = b.ty;
        b.mode = "idle";
      }
      el.style.left = b.x + "%";
      el.style.top = b.y + "%";
      el.classList.toggle("ask", asking);
      el.classList.toggle("sit", sit);
      const wrap = el.querySelector(".body");
      const bob = !running ? 0 : (b.mode === "walk" ? Math.abs(Math.cos(b.gait)) * 2.2 : Math.sin(sec * 1.6 + i) * 0.8);
      if (wrap) wrap.style.transform = "scaleX(" + b.face + ") translateY(" + (-bob) + "px)";
      const idle = running ? Math.sin(sec * 1.7 + i * 0.9) : 0;
      const g = b.gait;
      if (b.mode === "walk") {
        setJ(el, "head", Math.sin(g) * 5, 20, 7);
        setJ(el, "armL", Math.sin(g) * 26, 12, 16.2);
        setJ(el, "armR", -Math.sin(g) * 26, 28, 16.2);
        setJ(el, "legL", Math.sin(g) * 24, 15.4, 32.2);
        setJ(el, "legR", -Math.sin(g) * 24, 24.6, 32.2);
        setJ(el, "body", 0, 20, 24);
      } else if (b.mode === "sit") {
        setJ(el, "body", 6, 20, 32);
        setJ(el, "head", 4, 20, 7);
        setJ(el, "armL", 18, 12, 16.2);
        setJ(el, "armR", -12, 28, 16.2);
        setJ(el, "legL", -68, 15.4, 32.2);
        setJ(el, "legR", -54, 24.6, 32.2);
      } else {
        setJ(el, "body", idle * 2, 20, 32);
        setJ(el, "head", idle * 5, 20, 7);
        setJ(el, "armL", idle * 6, 12, 16.2);
        setJ(el, "armR", idle * 8, 28, 16.2);
        setJ(el, "legL", idle * 3, 15.4, 32.2);
        setJ(el, "legR", -idle * 3, 24.6, 32.2);
      }
    });
  }

  function toggleWalk(w, unit) {
    let via = w.walkVia;
    if (unit === "compute") via = w.gizmo ? "pull" : "warehouse";
    else if (unit === "slice") via = w.walkVia === "pull" ? "pull" : "duck";
    else if (unit === "cache") via = "cache";
    if (w.walkOpen && w.walkVia === via && !state.flying) {
      w.walkOpen = false;
      w.walkLive = false;
      return;
    }
    w.walkOpen = true;
    w.walkVia = via;
    if (!state.flying && w.walkStep < 0) {
      const rows = walkRows(w, via);
      w.walkRow = Math.max(0, rows.length - 1);
      w.walkStep = rows[w.walkRow] ? rows[w.walkRow].steps.length - 1 : -1;

  function fitFloor() {

  function linkPt(root, el, where) {
    const box = root.getBoundingClientRect();
    const a = el.getBoundingClientRect();
    return {
      x: a.left - box.left + a.width / 2,
      y: where === "top" ? a.top - box.top : a.top - box.top + a.height / 2,
    };
  }
  function curve(a, b) {
    const mid = (a.y + b.y) / 2;
    return "M" + a.x + " " + a.y + " C " + a.x + " " + mid + ", " + b.x + " " + mid + ", " + b.x + " " + b.y;
  }
  function drawLinks(root, w) {
    const svg = root.querySelector("svg.links");
    if (!svg || !w) return;
    const box = root.getBoundingClientRect();
    svg.setAttribute("viewBox", "0 0 " + box.width + " " + box.height);
    const agent = root.querySelector("[data-unit=agent]");
    const giz = root.querySelector("[data-unit=gizmo]");
    const warehouse = root.querySelector("[data-unit=warehouse]");
    const hop = w.gizmo ? (giz || warehouse) : (root.querySelector("[data-unit=inbox]") || warehouse);
    if (!agent || !hop) {
      svg.innerHTML = "";

    }
    const toAgent = linkPt(root, agent);
    const toHop = linkPt(root, hop);
    const live = w.lastWho;
    const gizCls = w.gizmo ? " giz" : "";

      if (!desk) return "";
      const from = linkPt(root, desk, "top");
      const id = "wire-" + (w.id || "a") + "-" + i;
      return `<path id="${id}" data-who="${i}" class="${gizCls}${live === i ? " on" : ""}" d="${curve(from, toAgent)}"/>` +
        `<circle class="bead${gizCls}" r="1.5">` +
        `<animateMotion dur="6s" repeatCount="indefinite" begin="${(i * 0.7).toFixed(1)}s" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear">` +
        `<mpath href="#${id}"/></animateMotion></circle>`;

    if (w.gizmo && warehouse && giz) {

  function askOne(who, pick) {
    if (state.flying) return;
    const flights = [];
    state.worlds.forEach((w) => {
      if (!w.built || who >= w.open) return;
      if (waitingOnCut(w)) return;
      if (w.restricted && !w.gizmo && state.askCool > 0) return;
      if (w.restricted && !w.gizmo) state.askCool = COOL_MS;
      talkFor(w);
      const dest = apply(w, who, pick);
      talkFor(w);
      if (w.alt && w.alt.built && who < w.alt.open
        && !waitingOnCut(w.alt) && !capLocked(w.alt)
        && !(w.alt.restricted && who >= CORE)) {
        apply(w.alt, who, pick);
        talkFor(w.alt);
      }
      flights.push({ w, who, dest });
    });
    if (!flights.length) return;
    mount();
    state.flying = true;
    let n = flights.length;
    flights.forEach((f) => fly(f.w, f.who, f.dest, () => {
      n -= 1;
      if (n <= 0) {
        state.flying = false;
        state.worlds.forEach((w) => {
          w.lastWho = -1;
          w.computeOn = false;
          w.cacheOn = false;
          w.duckOn = false;
          w.phase = "";
          if (!w.walkOpen) {
            w.walkLive = false;
            w.walkStep = -1;
          }
        });
        mount();
      }
    }));
  }

  function wait(ms) {

  function scanCards(root, hit) {

    if (rack) rack.classList.add("scan");

      if (cmp) {
        if (hit) cmp.classList.add("flash-match", "same");
        else cmp.classList.add("flash-miss", "new");

      if (hit && cache) {
        cache.classList.add("hit");
        cache.classList.remove("miss");

  function drainMeter(root, w) {
    const track = tankWorld(w);
    const fluid = root.querySelector("[data-fluid]");
    const budget = root.querySelector(".wh-budget");
    if (fluid) {
      const used = Math.min(100, Math.max(0, budgetUsed(track) * 100));
      fluid.classList.add("draining");
      requestAnimationFrame(() => { fluid.style.height = used + "%"; });
    }
    if (budget) {
      budget.classList.toggle("dead", capLocked(track) || usedDead(track) || track.restricted);
      budget.classList.toggle("warn", !capLocked(track) && !!track.warn);
      budget.classList.add("draining");

      if (amt) amt.innerHTML = money(Math.max(0, budgetCap(track) - track.whSpend)) + " <em>month left</em>";
    }

  function wakeCompute(root, w) {

    const power = root.querySelector(".wh-power");

    if (bay) {
      bay.classList.remove("miss");

    if (wharf) wharf.classList.add("work");
    if (pipe) pipe.classList.add("work");

      power.className = "wh-power on";
      power.innerHTML = "<i></i>ON";

  function dropCacheCard(root, w) {
    rememberCache(w, w.lastCacheKey, w.cacheChip);
    const rack = root.querySelector(".cache-rack");
    if (!rack || !w.cacheChip) return;
    const empty = rack.querySelector(".sub");
    if (empty) empty.remove();
    const card = document.createElement("span");
    card.className = "rcard fresh";
    card.textContent = w.cacheChip;
    rack.appendChild(card);
    while (rack.querySelectorAll(".rcard").length > 4) {
      const first = rack.querySelector(".rcard");
      if (first) first.remove();
    }
  }
  function sendResult(root, from, screen, label) {
    if (!from || !screen) return Promise.resolve();
    const pkt = placeChip(root, from, label || "result", "result-pkt");
    pkt.classList.remove("signal", "pale");
    pkt.classList.add("tag");
    return moveChip(root, pkt, screen, 380).then(() => pkt.remove());
  }
  function moveChip(root, p, to, ms) {
    return new Promise((resolve) => {
      if (!p || !to) { resolve(); return; }
      const r = root.getBoundingClientRect();
      const b = to.getBoundingClientRect();
      const x = b.left - r.left + b.width / 2 + "px";
      const y = b.top - r.top + 8 + "px";
      p.animate(
        [{ left: p.style.left, top: p.style.top }, { left: x, top: y }],
        { duration: ms, easing: "ease-in-out", fill: "forwards" }
      ).onfinish = () => {
        p.style.left = x;
        p.style.top = y;
        resolve();
      };
    });
  }
  function becomeTag(p, tag) {
    return new Promise((resolve) => {
      p.animate(
        [{ transform: "scale(1)", filter: "blur(0px)" }, { transform: "scale(0.55)", filter: "blur(3px)" }],
        { duration: 160, easing: "ease-in" }
      ).onfinish = () => {
        p.textContent = tag;
        p.classList.remove("signal", "pale", "emo-pkt");
        p.classList.add("tag");
        p.style.margin = "";
        p.animate(
          [{ transform: "scale(0.55)", filter: "blur(3px)" }, { transform: "scale(1)", filter: "blur(0px)" }],
          { duration: 200, easing: "ease-out" }
        ).onfinish = resolve;
      };
    });
  }

  function fly(w, who, dest, done) {
    const root = document.querySelector('[data-world="' + w.id + '"]') || document.getElementById("office");
    const desk = root.querySelector('.desk[data-who="' + who + '"]');
    const screen = (desk && desk.querySelector("[data-screen]")) || desk;
    const agent = root.querySelector("[data-unit=agent]");
    const warehouse = root.querySelector("[data-unit=warehouse]");
    const gizmo = root.querySelector("[data-unit=gizmo]");
    const tank = root.querySelector("[data-unit=tank]");
    const ask = currentAsk(who, w);
    const feel = askFeel(ask);
    const tag = w.askChip;
    const billed = dest === "compute" || dest === "pull";
    const person = root.querySelector('.person[data-person="' + who + '"]');
    const cloud = person && person.querySelector(".cloud");
    const chip = placeChip(root, cloud || screen, feel.emo, "emo-pkt");
    if (cloud) cloud.classList.add("sent");
    const wire = root.querySelector('svg.links path[data-who="' + who + '"]');
    if (wire) wire.classList.add("on");
    const inbox = root.querySelector("[data-unit=inbox]") || warehouse;
    const match = root.querySelector(".cmp") || warehouse;
    const cache = root.querySelector("[data-unit=cache]") || warehouse;
    const compute = root.querySelector("[data-unit=compute]") || warehouse;
    const slice = root.querySelector("[data-unit=slice]") || gizmo;
    sleepPlant(root);
    if (w.gizmo) chip.classList.add("giz-route");
    moveChip(root, chip, agent, 420).then(() => becomeTag(chip, tag)).then(() => {
      if (dest === "queue") return wait(500);
      if (dest === "bounce") return moveChip(root, chip, inbox, 320).then(() => moveChip(root, chip, screen, 400));
      if (dest === "duck") {
        if (gizmo) gizmo.classList.add("livepath");
        return moveChip(root, chip, gizmo || slice, 320)
          .then(() => moveChip(root, chip, slice, 360))
          .then(() => playWalkRows(root, w, [0]))
          .then(() => sendResult(root, slice || gizmo, screen, w.askChip));
      }
      if (dest === "pull") {
        if (gizmo) gizmo.classList.add("livepath");
        chip.classList.add("giz-route");
        chip.textContent = "load data";
        return moveChip(root, chip, gizmo || inbox, 300)
          .then(() => moveChip(root, chip, compute, 380))
          .then(() => wakeCompute(root, w))
          .then(() => playWalkRows(root, w, [0]))
          .then(() => {
            dropCacheCard(root, w);
            return moveChip(root, chip, slice || tank, 320);
          })
          .then(() => playWalkRows(root, w, [1]))
          .then(() => sendResult(root, slice || compute, screen, w.askChip));
      }
      return moveChip(root, chip, inbox, 400).then(() => {
        const pipe = root.querySelector(".pipe");
        if (pipe) pipe.classList.add("feed");
        return moveChip(root, chip, match, 260).then(() => {
          if (dest === "cache") {
            return scanCards(root, true)
              .then(() => playWalkRows(root, w, [0]))
              .then(() => sendResult(root, cache.querySelector(".rcard.match") || cache, screen, w.askChip));
          }
          if (w.lastFanout > 1) chip.textContent = w.lastFanout + " queries";
          return scanCards(root, false)
            .then(() => moveChip(root, chip, compute, 360))
            .then(() => wakeCompute(root, w))
            .then(() => playWalkRows(root, w, [0]))
            .then(() => {
              dropCacheCard(root, w);
              return sendResult(root, cache.querySelector(".rcard.fresh") || compute, screen, w.askChip);
            });
        });
      });
    }).then(() => {
      if (billed && tank && w.lastBite) {
        const r = root.getBoundingClientRect();
        const b = tank.getBoundingClientRect();
        const f = document.createElement("div");
        f.className = "bite-float";
        f.textContent = "−" + money(w.lastBite) + (w.lastFanout > 1 ? " · " + w.lastFanout + " queries" : "");
        f.style.left = b.left - r.left + b.width / 2 + "px";
        f.style.top = b.top - r.top + "px";
        root.appendChild(f);
        setTimeout(() => f.remove(), 800);
      }
      w.tankFrom = w.whSpend;
      if (wire) wire.classList.remove("on");
      chip.remove();
    }).then(() => {
      const last = w.log[0];
      if (dest === "bounce") holdAsk(w, who);
      if (last && last.who === PEOPLE[who].name && dest !== "queue") {
        recordCard(w, who, last.via, last.sf == null ? 0 : last.sf);
      }
      setTimeout(done, billed ? 700 : 400);
    });
  }

  function stepWorld(w) {
    if (!w.built) return null;
    talkFor(w);
    if (waitingOnCut(w) || capLocked(w)) return null;
    maybeUnlock(w);
    talkFor(w);
    const pool = [];
    for (let i = 0; i < w.open; i++) {
      if (w.restricted && i >= CORE) continue;
      pool.push(i);
    }
    if (!pool.length) return null;
    const who = pool[Math.floor(Math.random() * pool.length)];
    const dest = apply(w, who);
    talkFor(w);
    return { w, who, dest };
  }
  function launchFlights(flights) {
    if (!flights.length || state.flying) return;
    mount();
    state.flying = true;
    let n = flights.length;
    flights.forEach((f) => fly(f.w, f.who, f.dest, () => {
      n -= 1;
      if (n <= 0) {
        state.flying = false;
        state.worlds.forEach((x) => {
          x.lastWho = -1;
          x.computeOn = false;
          x.cacheOn = false;
          x.duckOn = false;
          x.phase = "";
          if (!x.walkOpen) {
            x.walkLive = false;
            x.walkStep = -1;
          }
        });
        mount();
      }
    }));
  }

  function tick(now) {
    if (!state.auto) return;
    if (!state.lastTick) state.lastTick = now;
    const dt = Math.min(80, now - state.lastTick);
    state.lastTick = now;
    state.playMs += dt;
    state.askCool = Math.max(0, state.askCool - dt);
    state.simHours += (dt / MONTH_MS) * WORK_HOURS;
    state.clock += dt * 0.012;
    accrue((dt / MONTH_MS) * WORK_HOURS);
    state.worlds.forEach((w) => bookResearch(w, dt));
    state.worlds.forEach((w) => checkBudget(w));
    state.worlds.forEach((w) => {
      if (w.computeOn) w.runSec += dt / 1000;
      else w.runSec = 0;
    });
    const widx = weekIndex();
    if (widx !== state.lastWeek) {
      state.lastWeek = widx;
      eachSim((w) => {
        w.weeks[widx].seats = Math.max(w.weeks[widx].seats, w.open);
        accrueGiz(w);
      });
      mount();
    }
    const gidx = Math.max(...state.worlds.map(gizWeekIndex));
    if (gidx !== state.lastGizWeek) {
      state.lastGizWeek = gidx;
      eachSim(accrueGiz);
      mount();
    }
    if (!state.flying) {
      const due = [];
      eachSim((w) => {
        if (!w.built || waitingOnCut(w) || capLocked(w)) return;
        w.askAcc = (w.askAcc || 0) + dt * askRate(w);
        if (w.askAcc > 1) {
          w.askAcc -= 1;
          const f = stepWorld(w);
          if (f && !w.silent) due.push(f);
        }
      });
      if (due.length) launchFlights(due);
    }
    if (state.playMs >= YEAR_MS) {
      state.playMs = YEAR_MS;
      state.auto = false;
      mount();
      return;
    }
    state.raf = requestAnimationFrame(tick);
  }

  function startAuto() {
    if (state.auto) return;
    if (!state.worlds.some((w) => w.built && !waitingOnCut(w))) return;
    state.auto = true;
    state.lastTick = 0;
    state.raf = requestAnimationFrame(tick);
    mount();
  }

  function reset(keepGizmo) {
    cancelAnimationFrame(state.raf);
    cancelAnimationFrame(state.chartRaf);
    state.chartRaf = 0;
    const giz = keepGizmo && state.worlds[0] && state.worlds[0].gizmo;
    const built = state.worlds[0] && state.worlds[0].built;
    state.auto = false;
    state.playMs = 0;
    state.simHours = 0;
    state.lastTick = 0;
    state.askAcc = 0;
    state.flying = false;
    state.clock = 9 * 60;
    state.lastWeek = 0;
    state.lastGizWeek = -1;
    state.lastMonth = 0;
    state.pausedForBudget = false;
    state.askCool = 0;
    state.yearRun = false;
    state.worlds = state.split
      ? [makeWorld("a", false), makeWorld("b", true)]
      : [makeWorld("a", !!giz)];
    state.worlds.forEach((w) => { w.built = built && keepGizmo; });
    if (state.split) state.worlds.forEach((w) => { w.built = built; });
    if (!state.split && giz) state.worlds[0].alt = cloneAlt(state.worlds[0]);
    mount();
  }

  document.getElementById("auto").onclick = () => {
    if (state.auto || state.yearRun) {
      state.auto = false;
      state.yearRun = false;
      mount();
    } else if (state.split) {
      state.worlds.forEach((w) => { w.built = true; });
      startAuto();
    } else {
      state.worlds.forEach((w) => { w.built = true; });
      startAuto();
    }
  };
  document.getElementById("gizmo").onclick = () => {
    if (state.split) return;
    const w = state.worlds[0];
    if (w.gizmo) stopGiz(w);
    else startGiz(w);
    mount();
  };
  document.getElementById("split").onclick = () => {
    state.split = !state.split;
    const built = state.worlds[0].built;
    reset(false);
    state.worlds.forEach((w) => { w.built = built; });
    mount();
    if (built) startAuto();
  };
  document.getElementById("reset").onclick = () => reset(true);
  let phoneLayout = onPhone();
  window.addEventListener("resize", () => {
    const phone = onPhone();
    if (phone !== phoneLayout) {
      phoneLayout = phone;
      parkBodies();
      mount();
      return;
    }
    if (!state.split || phone) {
      fitFloor();
      return;
    }
    const sc = paneScale();
    document.querySelectorAll("#office .office").forEach((el) => {
      el.style.setProperty("--scale", sc);
    });
    fitFloor();
  });

  mount();
})();
</script>
</body>
